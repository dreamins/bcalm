name: Build APK
on:
  push:
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    # GitHub-hosted Ubuntu runners ship with the Android SDK (ANDROID_HOME).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Set up signing key
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          PW: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/bcalm.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/bcalm.jks" >> "$GITHUB_ENV"
            echo "SIGNING_PASSWORD=$PW" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_B64 secret is missing; builds are signed with a random debug key and phone updates will fail."
          fi
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee build.log || {
            # Surface compiler/build errors as annotations
            grep -E '^(e: |\* What went wrong|FAILURE|.*error:)' -A3 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: AnxietyTracker-debug, path: app/build/outputs/apk/debug/*.apk }
      - name: Publish to "latest" release
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk bcalm.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest build" --notes "Debug APK built from main."
          gh release upload latest bcalm.apk --clobber
