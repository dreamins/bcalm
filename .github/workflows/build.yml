name: Build APK
on:
  push:
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    # GitHub-hosted Ubuntu runners ship with the Android SDK (ANDROID_HOME).
    runs-on: ubuntu-24.04
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Set up signing key
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          PW: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/bcalm.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/bcalm.jks" >> "$GITHUB_ENV"
            echo "SIGNING_PASSWORD=$PW" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_B64 secret is missing; builds are signed with a random debug key and phone updates will fail."
          fi
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleSideloadDebug assembleSideloadRelease bundlePlayRelease 2>&1 | tee build.log || {
            # Surface compiler/build errors as annotations
            grep -E '^(e: |\* What went wrong|FAILURE|.*error:)' -A3 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: AnxietyTracker-debug
          path: |
            app/build/outputs/apk/sideload/debug/*.apk
            app/build/outputs/apk/sideload/release/*.apk
            app/build/outputs/bundle/playRelease/*.aab
      - name: Publish to "latest" release
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp app/build/outputs/apk/sideload/debug/app-sideload-debug.apk bcalm.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest build" --notes "Debug APK built from main."
          gh release upload latest bcalm.apk --clobber
          # Release outputs are only uploaded when signed (signing secret present).
          RAPK=app/build/outputs/apk/sideload/release/app-sideload-release.apk
          RAAB=app/build/outputs/bundle/playRelease/app-play-release.aab
          if [ -f "$RAPK" ] && [ -f "$RAAB" ]; then
            cp "$RAPK" bcalm-release.apk
            cp "$RAAB" bcalm.aab
            gh release upload latest bcalm-release.apk bcalm.aab --clobber
            printf '{"versionCode": %s, "versionName": "1.0.%s-%s", "apk": "https://github.com/dreamins/bcalm/releases/download/latest/bcalm-release.apk"}\n' \
              "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" "${GITHUB_SHA::7}" > version.json
            gh release upload latest version.json --clobber
          else
            echo "::warning::Signed release APK/AAB not found (signing secret missing?); skipping bcalm-release.apk and bcalm.aab upload."
          fi
      # The Play API rejects status "completed" while the Play Console app is still a
      # "Draft app" (never published); only status "draft" is allowed then. Try
      # "completed" first (auto rollout to internal testers) and fall back to a draft
      # release if it fails. Once the app leaves draft, the fallback is never needed.
      - name: Upload to Google Play internal track
        id: play
        continue-on-error: true
        if: github.ref == 'refs/heads/main' && env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.dreamins.bcalm
          releaseFiles: app/build/outputs/bundle/playRelease/app-play-release.aab
          track: internal
          status: completed
      - name: Upload to Google Play internal track (draft app fallback)
        if: github.ref == 'refs/heads/main' && env.PLAY_JSON != '' && steps.play.outcome == 'failure'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.dreamins.bcalm
          releaseFiles: app/build/outputs/bundle/playRelease/app-play-release.aab
          track: internal
          status: draft
